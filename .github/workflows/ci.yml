name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only for `claude plugin validate`; no sign-in needed.
      - run: npm install -g @anthropic-ai/claude-code@2.1.266
      - run: npm run check
